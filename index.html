<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convocatoria Sistemas Operativos y Redes 2025</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #2e7dff, #00c6ff);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 40px 50px;
            border-radius: 16px;
            text-align: center;
            max-width: 700px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
            animation: fadeIn 1.2s ease;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.5;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            margin-top: 28px;
            background: #ffffff;
            color: #0078ff;
            font-weight: bold;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn:hover {
            background: #e8e8e8;
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Bienvenidos a la Convocatoria<br>de Sistemas Operativos y Redes</h1>
        <h2>Edición 2025</h2>

        <p>
            Tuvieron 14 semanas para chambear y 20 años para aprender linux y redes.
        </p>

        <p>
            Todas tus decisiones te han traído hasta acá.
        </p>

        <a href="#" class="btn">git push --force origin main</a>
    </div>
</body>
</html>
